name: Build SM CALL Android

on:
  push:
    branches: ["main"]
    paths:
      - "android/**"
      - "scripts/validate-android-firebase-config.mjs"
      - ".github/workflows/android-build.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "android/**"
      - "scripts/validate-android-firebase-config.mjs"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Validate Firebase Android configuration
        run: node scripts/validate-android-firebase-config.mjs

      - name: Build debug APK
        run: gradle --no-daemon -p android assembleDebug

      - name: Collect debug APK and signing fingerprints
        shell: bash
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          OUT="build-artifacts"
          mkdir -p "$OUT"

          if [ ! -f "$APK" ]; then
            echo "::error::Debug APK was not created."
            exit 1
          fi

          cp "$APK" "$OUT/app-debug.apk"
          "$APKSIGNER" verify --print-certs "$APK" > "$OUT/fingerprints.txt"
          grep -E "Signer #1 certificate SHA-1 digest|Signer #1 certificate SHA-256 digest" "$OUT/fingerprints.txt"

      - name: Upload debug APK and fingerprints
        uses: actions/upload-artifact@v4
        with:
          name: sm-call-debug-apk
          path: build-artifacts/*
          if-no-files-found: error
          retention-days: 14
