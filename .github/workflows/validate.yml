name: Validate SM CALL prototype

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Prototype and Firestore rules tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
      - name: Run prototype smoke checks
        run: npm run validate
      - name: Test Firestore rules in the emulator
        run: npx firebase --non-interactive emulators:exec --project demo-sm-call --only firestore "npm run test:rules"
